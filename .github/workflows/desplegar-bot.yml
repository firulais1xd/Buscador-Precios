name: Desplegar bot

# Publica el Worker de Cloudflare y conecta el bot de Telegram a él.
# Necesita los secretos: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GH_DISPATCH_TOKEN,
# TELEGRAM_TOKEN y TELEGRAM_CHAT_ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**"]

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar secretos
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.GH_DISPATCH_TOKEN }}
          D: ${{ secrets.TELEGRAM_TOKEN }}
          E: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          falta=""
          [ -z "$A" ] && falta="$falta CLOUDFLARE_API_TOKEN"
          [ -z "$B" ] && falta="$falta CLOUDFLARE_ACCOUNT_ID"
          [ -z "$C" ] && falta="$falta GH_DISPATCH_TOKEN"
          [ -z "$D" ] && falta="$falta TELEGRAM_TOKEN"
          [ -z "$E" ] && falta="$falta TELEGRAM_CHAT_ID"
          if [ -n "$falta" ]; then echo "::error::Faltan secretos:$falta"; exit 1; fi

      - name: Pruebas del Worker
        run: node worker/prueba.mjs

      - name: Clave del webhook (derivada del token, no se guarda en ningún lado)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          s=$(printf '%s' "$TELEGRAM_TOKEN-webhook-buscador" | sha256sum | cut -c1-48)
          echo "::add-mask::$s"
          echo "WEBHOOK_SECRET=$s" >> "$GITHUB_ENV"

      - name: Publicar en Cloudflare
        id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            TELEGRAM_TOKEN
            TELEGRAM_CHAT_ID
            GH_DISPATCH_TOKEN
            WEBHOOK_SECRET
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}

      - name: Conectar el bot de Telegram al Worker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          URL: ${{ steps.wrangler.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then echo "::error::Cloudflare no devolvió la URL del Worker. ¿Elegiste tu subdominio workers.dev?"; exit 1; fi
          echo "Worker: $URL"
          curl -sf "https://api.telegram.org/bot$TELEGRAM_TOKEN/setWebhook" \
            --data-urlencode "url=$URL" --data-urlencode "secret_token=$WEBHOOK_SECRET" \
            --data-urlencode 'allowed_updates=["message","edited_message"]' --data-urlencode "drop_pending_updates=true" | head -c 300; echo
          curl -sf "https://api.telegram.org/bot$TELEGRAM_TOKEN/setMyCommands" -H 'Content-Type: application/json' \
            -d '{"commands":[{"command":"buscar","description":"Buscar el mejor precio de un producto"},{"command":"ayuda","description":"Cómo usar el bot"}]}' | head -c 200; echo
          curl -sf "https://api.telegram.org/bot$TELEGRAM_TOKEN/getWebhookInfo" | python3 -c "import json,sys; d=json.load(sys.stdin)['result']; print('Webhook activo:', bool(d.get('url')), '| pendientes:', d.get('pending_update_count'), '| último error:', d.get('last_error_message'))"

name: Buscar producto

# Se activa desde el bot de Telegram (vía Cloudflare, repository_dispatch) o a mano desde Actions.
on:
  repository_dispatch:
    types: [buscar]
  workflow_dispatch:
    inputs:
      consulta:
        description: "Producto a buscar"
        required: true

permissions:
  contents: write

concurrency:
  group: buscar-${{ github.run_id }}

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar en todas las tiendas
        env:
          CONSULTA: ${{ github.event.client_payload.consulta || inputs.consulta }}
          CHAT_DESTINO: ${{ github.event.client_payload.chat }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.buscar
      - name: Guardar última búsqueda (diagnóstico)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ultima_busqueda.json 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "Última búsqueda"
          git pull -q --rebase && git push -q || true
